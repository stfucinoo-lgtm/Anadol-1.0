<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تصفح المقال - دوري الأناضول</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                dark: '#0c0c0e',
                card: '#16161a',
                accent: '#00ff87',
                accentHover: '#00e074',
                border: '#24242b'
              }
            },
            fontFamily: {
              cairo: ['Cairo', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .post-container {
            max-width: 850px;
            margin: 0 auto;
        }
        .post-featured-image {
            width: 100%;
            max-height: 480px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 2rem;
            border: 1px solid #24242b;
        }
        .post-body {
            font-size: 1.15rem;
            line-height: 1.9;
            color: #e2e8f0;
            white-space: pre-line;
        }
        .post-body p {
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body class="bg-brand-dark text-slate-100 font-cairo min-h-screen flex flex-col">

    <!-- 1. Navbar -->
    <nav class="border-b border-brand-border bg-brand-dark/90 backdrop-blur-md sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
          <div class="flex items-center gap-8">
            <a href="index.html" class="text-2xl font-black tracking-wider text-brand-accent no-underline">ANADOL</a>
            <div class="hidden md:flex space-x-reverse space-x-6">
              <a href="index.html" class="text-zinc-300 hover:text-brand-accent transition-colors font-semibold no-underline">الرئيسية</a>
              <a href="standings.html" class="text-zinc-300 hover:text-brand-accent transition-colors font-semibold no-underline">الترتيب</a>
              <a href="teams.html" class="text-zinc-300 hover:text-brand-accent transition-colors font-semibold no-underline">الفرق</a>
              <a href="blog.html" class="text-brand-accent hover:text-brand-accent transition-colors font-semibold no-underline">المدونة</a>
            </div>
          </div>
          <div id="navbar-auth-container">
            <!-- يتم ملؤه تلقائياً بواسطة AnadolAuth -->
          </div>
        </div>
      </div>
    </nav>

    <!-- 2. قسم المقال المنفرد -->
    <main class="py-12 flex-1">
        <div class="container mx-auto px-4 post-container">
            
            <!-- زر الرجوع للمدونة -->
            <a href="blog.html" class="text-brand-accent hover:underline inline-flex items-center gap-2 mb-6 font-semibold">
                <i class="fa-solid fa-arrow-right"></i> العودة لقائمة المقالات
            </a>

            <!-- تفاصيل المقال السليمة -->
            <div id="postLoader" class="text-center py-12 text-zinc-400">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl text-brand-accent mb-3"></i>
                <p>جاري تحميل نص المقال والتحليلات...</p>
            </div>

            <div id="postContentArea" class="hidden">
                <!-- عنوان المقال -->
                <h1 class="text-3xl md:text-4xl font-black mb-4 leading-tight text-white" id="postTitle">...</h1>
                
                <!-- البيانات الوصفية للمقال -->
                <div class="flex items-center gap-6 text-zinc-400 text-sm mb-6 border-b border-brand-border pb-4" id="postMeta">
                    <span><i class="fa-solid fa-user text-brand-accent"></i> <span id="postAuthor">المحرر الرياضي</span></span>
                    <span><i class="fa-solid fa-calendar-days text-brand-accent"></i> <span id="postDate">--</span></span>
                </div>

                <!-- الصورة البارزة للمقال -->
                <img src="" alt="صورة المقال" class="post-featured-image" id="postImage">

                <!-- متن المقال الكامل -->
                <article class="post-body bg-brand-card p-6 md:p-8 rounded-xl border border-brand-border mb-12" id="postBody">
                    <!-- محتوى المقال يوضع هنا -->
                </article>

                <!-- 3. قسم التعليقات (Comments Section) -->
                <section class="comments-section bg-brand-card/50 p-6 md:p-8 rounded-xl border border-brand-border">
                    <h3 class="text-2xl font-bold mb-6 text-white flex items-center gap-3">
                        <i class="fa-regular fa-comments text-brand-accent"></i> التعليقات والمناقشات (<span id="commentCount">0</span>)
                    </h3>

                    <!-- نموذج كتابة تعليق جديد -->
                    <div id="commentFormWrapper">
                        <form id="commentForm" class="space-y-4 mb-8">
                            <div>
                                <label for="commentContent" class="block text-sm font-semibold mb-2 text-zinc-300">أضف تعليقك الرياضي:</label>
                                <textarea id="commentContent" rows="3" class="w-full bg-brand-dark border border-brand-border rounded-lg p-3 text-white outline-none focus:border-brand-accent transition-colors" placeholder="شارِكنا رأيك الفني في المباراة والتحليل..." required></textarea>
                            </div>
                            <button type="submit" class="bg-brand-accent hover:bg-brand-accentHover text-brand-dark font-bold py-2.5 px-6 rounded-lg transition-colors flex items-center gap-2">
                                <i class="fa-solid fa-paper-plane"></i> إرسال التعليق
                            </button>
                        </form>
                    </div>

                    <!-- قائمة التعليقات -->
                    <div id="commentsList" class="space-y-4">
                        <p class="text-zinc-500 italic text-sm">لا توجد تعليقات بعد. كن أول المعلقين!</p>
                    </div>
                </section>
            </div>

        </div>
    </main>

    <!-- 4. الفوتر -->
    <footer class="footer bg-brand-card border-t border-brand-border py-8 text-zinc-400 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p>&copy; 2026 دوري الأناضول. جميع الحقوق محفوظة.</p>
        </div>
    </footer>

    <!-- GSAP Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const postId = params.get('id');

            const postLoader = document.getElementById('postLoader');
            const postContentArea = document.getElementById('postContentArea');

            if (!postId) {
                window.location.href = 'blog.html';
                return;
            }

            // 1. جلب بيانات المقال الحقيقي من الباك إند
            try {
                const response = await fetch(`/api/blog/${postId}`);
                if (!response.ok) throw new Error('المقال غير موجود');

                const post = await response.json();

                // تعبئة العنوان والبيانات
                document.getElementById('postTitle').textContent = post.title;
                document.getElementById('postDate').textContent = new Date(post.publishedAt || post.createdAt || Date.now()).toLocaleDateString('ar-EG', {
                    year: 'numeric', month: 'long', day: 'numeric'
                });
                
                document.getElementById('postImage').src = post.featuredImageUrl || 'https://images.unsplash.com/photo-1508098682722-e99c43a406b2?auto=format&fit=crop&q=80&w=1200';
                document.getElementById('postImage').alt = post.title;
                document.getElementById('postBody').textContent = post.body;

                postLoader.classList.add('hidden');
                postContentArea.classList.remove('hidden');

                // 2. جلب التعليقات الحقيقية للمقال
                loadComments(postId);

            } catch (error) {
                console.error('Error loading post:', error);
                postLoader.innerHTML = `
                    <div class="py-12 text-center text-red-400">
                        <i class="fa-solid fa-triangle-exclamation text-4xl mb-3"></i>
                        <p class="text-lg font-bold">عذراً، لم نتمكن من العثور على المقال المطلوب.</p>
                        <a href="blog.html" class="inline-block mt-4 text-brand-accent underline">العودة لقائمة المقالات</a>
                    </div>`;
            }

            // دالة جلب وعرض التعليقات
            async function loadComments(id) {
                const commentsList = document.getElementById('commentsList');
                const commentCount = document.getElementById('commentCount');

                try {
                    const res = await fetch(`/api/blog/${id}/comments`);
                    if (!res.ok) return;

                    const comments = await res.json();
                    commentCount.textContent = comments.length;

                    if (comments.length === 0) {
                        commentsList.innerHTML = `<p class="text-zinc-500 italic text-sm">لا توجد تعليقات بعد على هذا المقال. كن أول المعلقين!</p>`;
                        return;
                    }

                    commentsList.innerHTML = comments.map(c => `
                        <div class="bg-brand-dark p-4 rounded-lg border border-brand-border">
                            <div class="flex justify-between items-center mb-2">
                                <span class="font-bold text-brand-accent text-sm"><i class="fa-solid fa-circle-user"></i> ${c.username || 'زائر'}</span>
                                <span class="text-xs text-zinc-500">${new Date(c.createdAt).toLocaleDateString('ar-EG')}</span>
                            </div>
                            <p class="text-zinc-300 text-sm leading-relaxed">${c.content}</p>
                        </div>
                    `).join('');

                } catch (e) {
                    console.warn('Comments error:', e);
                }
            }

            // 3. إرسال تعليق جديد
            const commentForm = document.getElementById('commentForm');
            if (commentForm) {
                commentForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const contentInput = document.getElementById('commentContent');
                    const content = contentInput.value.trim();

                    if (!content) return;

                    const token = localStorage.getItem('anadol_token');

                    try {
                        const response = await fetch(`/api/blog/${postId}/comments`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': token ? `Bearer ${token}` : ''
                            },
                            body: JSON.stringify({ content })
                        });

                        if (response.ok) {
                            contentInput.value = '';
                            loadComments(postId);
                        } else {
                            alert('يرجى تسجيل الدخول أولاً لإرسال التعليق');
                        }
                    } catch (err) {
                        alert('حدث خطأ أثناء إرسال التعليق');
                    }
                });
            }
        });
    </script>
</body>
</html>
